<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="905" viewBox="0 0 1440 905" role="img" aria-labelledby="title desc"><title id="title">Bug 08 reconstructed visual</title><desc id="desc">Sanitized visual comparing the confirmed behavior before the fix with the expected result.</desc><defs><filter id="s" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity=".12"/></filter><style>.sans{font-family:Inter,"Segoe UI",Arial,sans-serif}.mono{font-family:"Cascadia Code",Consolas,monospace}.tag{font-size:18px;font-weight:700;letter-spacing:2px}.line{font-size:21px;fill:#e5edff}.obs{font-size:22px;fill:#7f1d1d}.exp{font-size:20px;fill:#065f46}.strong{font-weight:750}.muted{fill:#64748b}</style></defs><rect width="1440" height="920" fill="#f4f7ff"/><circle cx="1325" cy="70" r="180" fill="#dbe7ff" opacity=".7"/><circle cx="70" cy="900" r="180" fill="#dcfce7" opacity=".55"/><g class="sans"><rect x="60" y="46" width="266" height="38" rx="19" fill="#fef3c7"/><text x="82" y="72" class="tag" fill="#92400e">RECONSTRUCTED VISUAL</text><text x="60" y="126" font-size="36" font-weight="800" fill="#111827">Bug 08 · Mobile menu covered the page</text><text x="60" y="158" font-size="20" class="muted">Sanitized reproduction of the confirmed pre-fix behaviour.</text><g filter="url(#s)"><rect x="60" y="194" width="610" height="520" rx="24" fill="#111b38"/><rect x="700" y="194" width="680" height="520" rx="24" fill="#fff"/></g><text x="92" y="240" class="tag" fill="#9fb5ff">TEST CONTEXT</text><text x="92" y="278" font-size="27" font-weight="750" fill="#fff">Sanitized reproduction</text><line x1="92" y1="304" x2="638" y2="304" stroke="#34436b"/><text x="92" y="352" class="mono line">Viewport width: 390 px</text>
