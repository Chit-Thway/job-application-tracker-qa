<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="940" viewBox="0 0 1440 940" role="img" aria-labelledby="title desc">
  <title id="title">Bug 01 reconstructed extraction visual</title>
  <desc id="desc">A sanitized job advertisement with clear title, company, location, salary, and closing date is compared with the original importer result, where all useful suggestions were blank.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .mono { font-family: "Cascadia Code", Consolas, monospace; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
      .label { font-size: 18px; font-weight: 700; fill: #334155; }
      .value { font-size: 18px; fill: #0f172a; }
      .muted { fill: #64748b; }
    </style>
  </defs>

  <rect width="1440" height="980" fill="#f4f7ff"/>
  <circle cx="1320" cy="70" r="180" fill="#dbe7ff" opacity="0.7"/>
  <circle cx="90" cy="930" r="210" fill="#dcfce7" opacity="0.55"/>

  <g class="sans">
    <rect x="60" y="48" width="282" height="38" rx="19" fill="#fef3c7"/>
    <text x="82" y="74" class="eyebrow" fill="#92400e">RECONSTRUCTED VISUAL</text>
    <text x="60" y="126" font-size="36" font-weight="800" fill="#111827">Bug 01 · Pasted-text extraction</text>
    <text x="60" y="158" font-size="20" class="muted">What the user supplied compared with the original review draft.</text>

    <g filter="url(#shadow)">
      <rect x="60" y="194" width="610" height="552" rx="24" fill="#111b38"/>
      <rect x="700" y="194" width="680" height="552" rx="24" fill="#ffffff"/>
    </g>

    <text x="96" y="240" class="eyebrow" fill="#9fb5ff">SANITIZED INPUT</text>
    <text x="96" y="278" font-size="27" font-weight="750" fill="#ffffff">Realistic stacked job-board text</text>
    <line x1="96" y1="304" x2="634" y2="304" stroke="#34436b"/>

    <g class="mono" font-size="21" fill="#e5edff">
      <text x="96" y="352">2027 Computer Science Graduate Program</text>
      <text x="96" y="382">— Cybersecurity</text>
      <text x="96" y="434" fill="#8fb0ff">Example Consulting</text>
      <text x="96" y="476">Sydney NSW</text>
      <text x="96" y="518">$70,000 – $80,000 a year</text>
      <text x="96" y="560">No experience required</text>
      <text x="96" y="614">About the role</text>
      <text x="96" y="652" fill="#b8c5e6">Help clients understand cyber risk...</text>
      <text x="96" y="700" fill="#b8c5e6">Applications close Sunday, 16 August.</text>
    </g>

    <text x="738" y="240" class="eyebrow" fill="#dc2626">OBSERVED BEFORE FIX</text>
    <text x="738" y="278" font-size="27" font-weight="750" fill="#111827">Extraction review</text>
    <rect x="1180" y="226" width="156" height="38" rx="19" fill="#fee2e2"/>
    <text x="1202" y="252" font-size="17" font-weight="750" fill="#b91c1c">0 suggestions</text>
    <line x1="738" y1="304" x2="1342" y2="304" stroke="#dbe3f0"/>

    <text x="738" y="348" class="label">Role title</text>
    <rect x="738" y="364" width="604" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="760" y="397" class="value muted">Blank</text>

    <text x="738" y="458" class="label">Company</text>
    <rect x="738" y="474" width="286" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="760" y="507" class="value muted">Blank</text>

    <text x="1056" y="458" class="label">Location</text>
    <rect x="1056" y="474" width="286" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="1078" y="507" class="value muted">Blank</text>

    <text x="738" y="568" class="label">Salary</text>
    <rect x="738" y="584" width="286" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="760" y="617" class="value muted">Blank</text>

    <text x="1056" y="568" class="label">Closing date</text>
    <rect x="1056" y="584" width="286" height="52" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="7 7"/>
    <text x="1078" y="617" class="value muted">Blank</text>

    <rect x="738" y="670" width="604" height="48" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="760" y="701" font-size="18" font-weight="650" fill="#9a3412">Useful information was visible, but the draft still required retyping.</text>

    <rect x="60" y="782" width="1320" height="144" rx="24" fill="#eaf8ef" stroke="#86d7a5" stroke-width="2"/>
    <text x="94" y="824" class="eyebrow" fill="#047857">EXPECTED REVIEW SUGGESTIONS</text>
    <text x="94" y="866" font-size="21" font-weight="700" fill="#064e3b">Role: Cybersecurity graduate program</text>
    <text x="492" y="866" font-size="21" font-weight="700" fill="#064e3b">Company: Example Consulting</text>
    <text x="925" y="866" font-size="21" font-weight="700" fill="#064e3b">Location: Sydney NSW</text>
    <text x="94" y="902" font-size="20" fill="#065f46">Salary: $70,000–$80,000 a year</text>
    <text x="492" y="902" font-size="20" fill="#065f46">Closing date: 16 August</text>

    
  </g>
</svg>
